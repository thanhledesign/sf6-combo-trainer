<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SF6 Trainer · Session Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--ink:#0d1015;--panel:#161b23;--panel2:#1e2531;--line:#2b3441;--text:#e9edf3;--mute:#8d97a8;--win:#3db4ff;--loss:#ff5d73;--gold:#f3b53a;--ok:#4cd39a;--u:1;
--display:"Barlow Condensed","Arial Narrow",sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:calc(16px*var(--u))}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--text);font-family:var(--body);line-height:1.35}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100dvh}
#top{display:flex;gap:.6rem;align-items:stretch;flex-wrap:wrap;padding:.5rem .7rem;border-bottom:1px solid var(--line)}
.me{display:flex;align-items:center;gap:.7rem;background:var(--panel2);border:2px solid var(--gold);border-radius:.8rem;padding:.2rem 1rem;min-height:3.4rem;text-align:left}
.me small{display:block;font-size:.62rem;color:var(--mute);letter-spacing:.16em}
.me b{font:700 2rem/1 var(--display);letter-spacing:.06em;color:var(--gold);text-transform:uppercase}
.me span.c{color:var(--gold);font-size:1rem}
.seg3,#tabs{display:flex;gap:.3rem}
.seg3 button,#tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;min-width:4.2rem;min-height:3.4rem;padding:.2rem .5rem;background:var(--panel2);border:1px solid var(--line);border-radius:.7rem;font-size:.72rem;font-weight:600;color:var(--mute)}
.seg3 svg,#tabs svg{width:1.55rem;height:1.55rem}
.seg3 button[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#1d1400}
#tabs{margin-left:auto}
#tabs button[aria-pressed=true]{background:var(--win);border-color:var(--win);color:#04121c}
.sync{display:flex;align-items:center;gap:.4rem;font-size:.72rem;color:var(--mute);align-self:center}
.sync i{width:.55rem;height:.55rem;border-radius:50%;background:var(--mute)}
.sync.ok i{background:var(--ok)}.sync.warn i{background:var(--gold)}
#panes{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:0;padding:.6rem;min-height:0}
.gutter{position:relative;cursor:col-resize;touch-action:none;min-width:.6rem;min-height:.6rem}
.gutter::after{content:"";position:absolute;top:20%;bottom:20%;left:50%;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--line);transition:background .12s}
.gutter:hover::after,.gutter.drag::after{background:var(--gold)}
.vsp{flex:0 0 .8rem;margin:-.15rem 0;position:relative;cursor:row-resize;touch-action:none}
.vsp::after{content:"";position:absolute;left:35%;right:35%;top:50%;height:3px;margin-top:-1.5px;border-radius:2px;background:var(--line);transition:background .12s}
.vsp:hover::after,.vsp.drag::after{background:var(--gold)}
@media (max-width:760px){.gutter{cursor:row-resize}.gutter::after{top:50%;bottom:auto;left:20%;right:20%;width:auto;height:3px;margin:-1.5px 0 0}#panes{grid-auto-flow:row;grid-auto-columns:auto;grid-auto-rows:minmax(0,1fr)}#tabs{margin-left:0;width:100%}#tabs button{flex:1}}
.pane{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:.9rem;padding:.7rem;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:.5rem}
.fill{flex:1;min-height:0}
h2{font:700 1.7rem/1.1 var(--display);margin:0;letter-spacing:.02em}
h3{font:700 1.05rem/1.2 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:.9rem 0 .4rem}
label{display:block;font-size:.8rem;color:var(--mute);font-weight:500}
input[type=text],input[type=number],select,textarea{width:100%;margin-top:.2rem;background:var(--panel2);border:1px solid var(--line);border-radius:.6rem;padding:.55rem .7rem;min-height:2.8rem;font-size:1rem}
textarea{resize:none;min-height:3rem}
.mute{color:var(--mute)}.warn{color:var(--gold)}.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:.6rem;padding:.55rem .9rem;min-height:2.8rem;font-weight:600}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#1d1400}
.btn.danger{border-color:var(--loss);color:var(--loss)}
.btn.huge{min-height:4rem;font:700 1.6rem var(--display);letter-spacing:.08em;text-transform:uppercase}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:.6rem}
.startv{display:flex;flex-direction:column;gap:.6rem;height:100%;overflow:auto}
.scales{display:grid;gap:.5rem}
.scale{display:flex;align-items:center;gap:.8rem;background:var(--panel2);border:1px solid var(--line);border-radius:.7rem;min-height:3.4rem;padding:.3rem .9rem;cursor:ew-resize;touch-action:none;user-select:none}
.scale .lbl{width:9rem;font-weight:600}.scale .lbl small{display:block;font-size:.65rem;color:var(--mute);font-weight:400}
.scale .bars{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:.3rem;height:2.3rem}
.scale .bars i{background:var(--panel);border-radius:.3rem}
.scale .bars i.on{background:var(--gold)}
.scale .n{font:700 1.8rem/1 var(--mono);width:2rem;text-align:right}

.focusbar{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.fchip{display:flex;align-items:baseline;gap:.5rem;background:var(--panel2);border:2px solid var(--gold);border-radius:.6rem;padding:.35rem .7rem;min-height:2.6rem;text-align:left;max-width:100%}
.fchip b{color:var(--gold)}.fchip .mono{font-size:1.05rem;white-space:normal;word-break:break-word}
.cb{display:flex;flex-direction:column;gap:.6rem}
.cbhead{display:grid;grid-template-columns:2fr 1fr;gap:.5rem}
.cbhead input,.cbhead select{min-height:3.2rem;font-size:1.05rem}
.cbline{min-height:5rem;background:var(--ink);border:2px solid var(--line);border-radius:.7rem;padding:.7rem .9rem;font:700 1.9rem/1.25 var(--mono);word-break:break-word;outline:0;cursor:text}
.cbline:focus{border-color:var(--gold)}
.cbline .ph{color:var(--mute);font:500 1rem var(--body)}
.cbline .caret{display:inline-block;width:.14em;height:1.05em;background:var(--gold);vertical-align:-.15em;margin-left:.1em;animation:blink 1s steps(2) infinite}
@keyframes blink{to{opacity:0}}
.cbpad{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:.6rem}
.dirs{display:grid;grid-template-columns:repeat(3,1fr);gap:.35rem}
.dirs button,.pk button,.cbx button{min-height:3.4rem;font:700 1.35rem var(--mono);background:var(--panel2);border:1px solid var(--line);border-radius:.6rem;touch-action:none;user-select:none}
.dirs button:active,.pk button:active,.pk button.down,.cbx button:active{background:var(--gold);color:#1d1400}
.pk{display:grid;grid-template-columns:1fr 1fr;gap:.35rem}.pk button{font-size:1.7rem;font-family:var(--display);letter-spacing:.06em}
.cbpad .pk{grid-template-columns:1fr 1fr}.pk button,.cbx button,.cbmv button{position:relative}
kbd{position:absolute;top:.15rem;right:.3rem;font:600 .6rem var(--mono);color:var(--mute);background:none;border:0;padding:0}
.cbmv{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.2rem,1fr));gap:.35rem}.cbmv button{min-height:3rem;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--panel2);border:1px solid var(--line);border-radius:.6rem;font:700 1rem var(--mono);padding:.2rem}.cbmv button small{font:500 .62rem var(--body);color:var(--mute)}.cbmv button.chr{border-color:var(--gold)}.cbmv button:active{background:var(--gold);color:#1d1400}

.rv{display:flex;flex-direction:column;gap:.55rem}.rv label{display:flex;flex-direction:column;gap:.2rem;font:600 .72rem var(--body);color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.rv input,.rv select,.rv textarea{font:500 1rem var(--body);background:var(--ink);color:inherit;border:1px solid var(--line);border-radius:.55rem;padding:.55rem .65rem;min-height:2.8rem;text-transform:none;letter-spacing:0}
.rv textarea{min-height:4rem;resize:vertical}.rv input:focus,.rv select:focus,.rv textarea:focus{outline:0;border-color:var(--gold)}
.rvg{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr));gap:.5rem}
.rvrow{border:1px solid var(--line);border-radius:.7rem;padding:.6rem .7rem;background:var(--panel2);display:flex;flex-direction:column;gap:.3rem}.rvrow.done{opacity:.55}
.rvh{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}.rvh b{font-size:1.05rem}.rvtag{font:700 .68rem var(--body);padding:.15rem .5rem;border-radius:1rem;background:var(--gold);color:#1d1400}
.rvrow p{margin:0;font-size:.9rem;line-height:1.35}.rvrow p span{color:var(--mute);font:700 .68rem var(--body);text-transform:uppercase;letter-spacing:.05em;margin-right:.35rem}
.rvq{font:600 .8rem var(--body);color:var(--mute)}
.cbx{display:flex;flex-wrap:wrap;gap:.35rem}.cbx button{min-height:2.8rem;font-size:1rem;padding:0 .8rem}
.cbacts{display:flex;gap:.5rem;flex-wrap:wrap}.cbacts .btn{flex:1;min-width:6rem}
.cbhelp{font-size:.78rem;line-height:1.4;margin:0}
.cbrow{display:flex;align-items:center;gap:.6rem;background:var(--panel2);border:1px solid var(--line);border-radius:.7rem;padding:.5rem .6rem}
.cbrow.foc{border-color:var(--gold)}
.cbtick{flex:none;width:3rem;height:3rem;border-radius:.6rem;border:2px solid var(--line);background:var(--ink);font:700 1.6rem/1 var(--body);color:var(--gold)}
.cbtick[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#1d1400}
.cbmain{flex:1;min-width:0}.cbstr{font-size:1.15rem;word-break:break-word}
.livev.idle{opacity:.5;pointer-events:none;filter:saturate(.7)}
.startv.sheet{position:absolute;left:0;right:0;bottom:0;height:auto;max-height:64%;background:var(--panel);border-top:2px solid var(--gold);border-radius:.9rem .9rem 0 0;padding:.7rem;box-shadow:0 -10px 30px rgba(0,0,0,.55);z-index:5}
.startv:not(.sheet) .lastnote{display:none}
.meimg{width:2.6rem;height:2.6rem;flex:none;border-radius:.5rem;background:var(--panel) center top/cover no-repeat;box-shadow:inset 0 0 0 1px rgba(0,0,0,.4)}
.meimg:empty{}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(6.2rem,1fr));gap:.4rem}
.pick .optile{border-radius:.6rem;overflow:hidden;cursor:pointer}
.pick .optile[aria-pressed="true"]{outline:3px solid #fff;outline-offset:-3px}
.livev{display:flex;flex-direction:column;gap:.5rem;height:100%;min-height:0}
.strip{display:grid;grid-template-columns:repeat(3,1fr) 1.7fr auto;gap:.4rem}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:.6rem;padding:.3rem .6rem;text-align:left}
.stat b{display:block;font:700 1.6rem/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:.62rem;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.lights{display:flex;gap:.3rem;min-height:1.7rem;align-items:center;flex-wrap:wrap}
.lights i{width:1.05rem;height:1.05rem;border-radius:50%;border:2px solid var(--loss);display:inline-block}
.lights i.on{background:var(--loss)}
.stopctl{display:flex;align-items:center;gap:.3rem}
.mini{min-width:2.3rem;min-height:2.3rem;border-radius:.5rem;border:1px solid var(--line);background:var(--panel);font-weight:700}
.rmcard{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;background:var(--panel2);border:1px solid var(--line);border-radius:.7rem;padding:.4rem .6rem}
.rmcard .who{flex:1;min-width:8rem}
.chargrid{flex:1 1 0;min-height:6rem;display:grid;grid-template-columns:repeat(var(--cols,8),1fr);gap:0;margin:-.7rem -.7rem 0;align-content:start;overflow:auto;background:var(--ink)}
.optile{position:relative;aspect-ratio:1;border:0;border-radius:0;padding:0;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,hsl(var(--h) 45% 32%),hsl(var(--h) 50% 15%));box-shadow:inset 0 0 0 1px rgba(0,0,0,.4);transition:opacity .12s,filter .12s;overflow:hidden;filter:grayscale(1) brightness(.72)}
.optile:hover{filter:grayscale(.35) brightness(.92)}
.optile[aria-pressed="true"]{filter:none;outline:3px solid #fff;outline-offset:-3px;z-index:2}
.optile .ini{font:700 clamp(1rem,calc(var(--ts,60px)*.4),2.8rem)/1 var(--display);letter-spacing:.04em}
.optile .nm{position:absolute;bottom:.15rem;left:0;right:0;text-align:center;font-size:clamp(.5rem,calc(var(--ts,60px)*.14),.8rem);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 .15rem}
.optile.has-img{background-size:cover;background-position:center top}
.optile.has-img .ini{display:none}
.optile.has-img .nm{bottom:0;padding-top:.7rem;background:linear-gradient(transparent,rgba(0,0,0,.75));opacity:1}
.optile .bd{position:absolute;top:.2rem;right:.3rem;font:700 .85rem var(--mono);color:var(--gold)}
.modetabs{display:flex;gap:.3rem;align-items:center}
.modetabs .chip{flex:1;padding:.3rem .4rem;min-height:2.4rem}
.setbar{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;background:var(--panel2);border:1px solid var(--gold);border-radius:.7rem;padding:.35rem .6rem}
.setbar b{font:700 1.2rem var(--display);letter-spacing:.05em;text-transform:uppercase}
.setbar .btn{margin-left:auto;min-height:2.4rem}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;max-height:5.6rem;overflow:auto}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:.55rem;padding:.35rem .6rem;min-height:2.6rem;font-weight:500;font-size:.9rem}
.chip[aria-pressed=true]{background:var(--win);border-color:var(--win);color:#04121c}
.chip.leak{border-left:3px solid var(--loss)}.chip.good{border-left:3px solid var(--ok)}
.chip.leak[aria-pressed=true]{background:var(--loss);border-color:var(--loss);color:#1c060b}
.chip.good[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:#052016}
.chip.add{border-style:dashed;color:var(--mute)}
.mrrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:.6rem}
.mrrow label{font-size:.95rem;font-weight:700;color:inherit;letter-spacing:.02em}
#opp{font:700 1.9rem/1.1 var(--body);min-height:5.2rem;padding:.4rem .9rem;border-radius:.7rem;margin-top:.2rem}
.scrub{position:relative;display:flex;align-items:center;justify-content:center;background:var(--panel2);border:1px solid var(--line);border-radius:.7rem;min-height:5.2rem;margin-top:.2rem;cursor:ns-resize;touch-action:none;user-select:none;font:700 3.4rem/1 var(--mono)}
.scrub .hint{position:absolute;right:.5rem;top:.3rem;font:500 .62rem var(--body);color:var(--mute)}
.scrub input{width:100%;text-align:center;background:transparent;border:0;font:inherit;outline:0;min-height:0;padding:0;margin:0}
.rmbtn{width:100%;min-height:3.6rem;margin-top:.2rem}
.rmbtn[aria-pressed=true]{background:var(--gold);color:#1d1400;border-color:var(--gold)}
.wl{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;flex:0 0 clamp(4.2rem,15vh,8rem)}
.big{border:0;border-radius:.9rem;font:700 clamp(1.8rem,6vh,3rem)/1 var(--display);letter-spacing:.08em;text-transform:uppercase}
.big.win{background:var(--win);color:#04121c}.big.loss{background:var(--loss);color:#1c060b}
.big:active{transform:translateY(1px)}
.rmcard .big{padding:.4rem 1rem;min-height:3rem;font-size:1.4rem}
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(10rem,1fr));grid-auto-rows:minmax(6.5rem,1fr);gap:.6rem;height:100%}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:.9rem;padding:.7rem;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.tile>span{font-size:.7rem;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.tile>b{font:700 clamp(2.2rem,9vmin,5.2rem)/1 var(--display);font-variant-numeric:tabular-nums}
.tile.s2{grid-column:span 2}
.rule{font:700 clamp(1.4rem,5vmin,2.6rem)/1.1 var(--display)}
.cues{display:flex;gap:.5rem;flex-wrap:wrap}
.cues em{font:700 1.3rem/1 var(--display);font-style:normal;border:1px solid var(--gold);color:var(--gold);padding:.35rem .7rem;border-radius:.6rem;text-transform:uppercase;letter-spacing:.06em}
.dots{display:flex;gap:.35rem;flex-wrap:wrap}
.dots i{width:1.6rem;height:1.6rem;border-radius:.35rem}
.dots i.W{background:var(--win)}.dots i.L{background:var(--loss)}
.bar{height:.8rem;background:var(--panel);border-radius:.4rem;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:.8rem;padding:.7rem}
.goal{margin-bottom:.5rem}
.goal .gt{display:flex;justify-content:space-between;gap:.5rem;margin-bottom:.4rem}
.goal .gb{display:flex;gap:.4rem;margin-top:.5rem}
.goal.done{opacity:.8;border-color:var(--ok)}
.sugg{display:flex;flex-wrap:wrap;gap:.4rem}
table{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:.4rem .5rem;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:500;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em}
.tw{overflow-x:auto}
.game{display:grid;grid-template-columns:2rem 1fr auto;gap:.6rem;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:.6rem;padding:.4rem .6rem;text-align:left;width:100%;margin-bottom:.3rem}
.game .r{font:700 1.4rem/1 var(--display);text-align:center}
.game.W .r{color:var(--win)}.game.L .r{color:var(--loss)}
.game small{color:var(--mute);display:block}
.orow{display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:.55rem 0;border-bottom:1px solid var(--line)}
.orow small{display:block;color:var(--mute);font-size:.75rem}
.step{display:flex;align-items:center;gap:.3rem}
.step button{width:2.8rem;height:2.8rem;border-radius:.6rem;border:1px solid var(--line);background:var(--panel2);font:700 1.3rem var(--body)}
.step b{min-width:3.2rem;text-align:center;font:700 1.3rem var(--mono)}
.sw{width:3.6rem;height:2.1rem;border-radius:1.1rem;border:1px solid var(--line);background:var(--panel2);position:relative;flex:none}
.sw i{position:absolute;top:.2rem;left:.2rem;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--mute);transition:left .12s}
.sw[aria-checked=true]{background:var(--ok);border-color:var(--ok)}
.sw[aria-checked=true] i{left:1.7rem;background:#052016}
.overlay{position:fixed;inset:0;background:rgba(5,7,10,.88);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:20}
.overlay .card{max-width:34rem;width:100%;max-height:94%;overflow:auto;background:var(--panel)}
.tmrow{display:grid;grid-template-columns:1fr 7rem 2.8rem;gap:.5rem;margin-bottom:.5rem}
.tmrow input,.tmrow select{margin-top:0}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(7rem,1fr));gap:.4rem;margin-top:.6rem}
#toast{position:fixed;left:50%;bottom:1rem;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:.6rem .9rem;border-radius:.6rem;z-index:30;display:none}
</style>
</head>
<body>
<div id="app">
<header id="top">
  <button id="meBtn" class="me" type="button" data-act="me-open" aria-label="Change character"><span id="meImg" class="meimg"></span><div><small>PLAYING AS</small><b id="meName">KEN</b></div><span class="c">▾</span></button>
  <div id="devSeg" class="seg3" role="group" aria-label="Input device"></div>
  <div id="sync" class="sync" role="status"><i></i><span>Connecting</span></div>
  <nav id="tabs" aria-label="Panes (tap several to split the screen)"></nav>
</header>
<main id="panes"></main>
</div>

<div id="charPick" class="overlay" hidden><div class="card"><h2>Playing as</h2><div id="pickGrid" class="pick"></div><p><button class="btn" type="button" data-act="close" data-o="charPick">Close</button></p></div></div>

<div id="lock" class="overlay" hidden><div class="card">
  <h2 id="lockTitle" class="warn">Stop.</h2>
  <p>Write the one situation that beat you. Then you can queue again.</p>
  <textarea id="lockNote" aria-label="Situation that beat me" placeholder="When ___ happened, I did ___ instead of ___" style="min-height:6rem"></textarea>

/* drag engine: vertical for MR, horizontal for scales */
function scrubber(el,o){
  var sx=0,sy=0,v0=0,down=false,drag=false;

    if((e.button||0)>0||el.classList.contains("editing"))return;

    try{el.setPointerCapture(e.pointerId)}catch(_){}
  });
  el.addEventListener("pointermove",function(e){
    if(!down)return;
    if(!drag&&Math.hypot(e.clientX-sx,e.clientY-sy)<5)return;
    drag=true;if(e.cancelable)e.preventDefault();
    var d=o.axis==="x"?(e.clientX-sx):(sy-e.clientY),p=o.pace();if(e.shiftKey)p=Math.max(1,p/5);
    o.set(clamp(v0+Math.trunc(d/p),o.min,o.max));
  });
  function up(){var was=down&&!drag;el.__dragged=drag;down=false;if(was&&o.edit)startEdit()}
  el.addEventListener("pointerup",up);el.addEventListener("pointercancel",function(){down=false});
  el.addEventListener("wheel",function(e){e.preventDefault();o.set(clamp(o.get()+(e.deltaY<0?1:-1),o.min,o.max))},{passive:false});
  el.addEventListener("keydown",function(e){
    var k=e.key,st=e.shiftKey?10:1;
    if(k==="ArrowUp"||k==="ArrowRight"){e.preventDefault();o.set(clamp(o.get()+st,o.min,o.max))}
    else if(k==="ArrowDown"||k==="ArrowLeft"){e.preventDefault();o.set(clamp(o.get()-st,o.min,o.max))}
    else if(k==="Enter"&&o.edit)startEdit();
  });
  function startEdit(){
    el.classList.add("editing");var v=o.get();
    el.innerHTML='<input type="number" inputmode="numeric" aria-label="Type a value" value="'+v+'">';
    var i=el.firstChild;i.focus();i.select();

    i.addEventListener("blur",function(){fin(true)});

var ALIAS={deejay:"Dee Jay",dj:"Dee Jay",honda:"E. Honda",ehonda:"E. Honda",bison:"M. Bison",mbison:"M. Bison",viper:"C. Viper",cviper:"C. Viper",aki:"A.K.I.",chunli:"Chun-Li"};
function matchChar(stem){
  var n=norm(stem),i;if(!n)return null;
  for(i=0;i<ROSTER.length;i++){if(norm(ROSTER[i])===n)return ROSTER[i]}
  if(ALIAS[n])return ALIAS[n];
  var byLen=ROSTER.slice().sort(function(a,b){return norm(b).length-norm(a).length});
  for(i=0;i<byLen.length;i++){var m=norm(byLen[i]);if(m.length>=3&&n.indexOf(m)>=0)return byLen[i]}
  for(var k in ALIAS){if(k.length>=3&&n.indexOf(k)>=0)return ALIAS[k]}
  return null;
}

  if(t.dataset.pk){if(e.detail===0){cbDown(t.dataset.pk);cbUp(t.dataset.pk)}return}
  if(act){
    var id=t.dataset.id;
    if(act==="cb-dir")cbDir(t.dataset.k);
    else if(act==="cb-tok")cbTok(t.dataset.k);

    else if(act==="cb-save")cbSave();

    else if(act==="rv-del")rvDel(id);
    else if(act==="rv-done")rvDone(id);

    else if(act==="sw")setOpt(t.dataset.k,!optGet(t.dataset.k));
    else if(act==="end")endSession();
    else if(act==="mode"){saveSettings({mode:t.dataset.m});resetForm(false)}
    else if(act==="set-end")endSet();
    else if(act==="port-import"){portTarget=null;$("#fileIn").click()}
    else if(act==="port-pick"){portTarget=t.dataset.c;$("#fileIn").click()}
    else if(act==="port-clear"){S.portraits.slice().forEach(function(q){del("portraits",q.id)})}
    else if(act==="hist-mode"){H.mode=t.dataset.m;render()}
    else if(act==="study-edit")goStudy($("#eChar").value);
    else if(act==="study")goStudy(t.dataset.c);
    else if(act==="go")goTo(t.dataset.to);
    else if(act==="edit-last"){var l2=lastGame();if(l2)openEdit(l2.id)}

    else if(act==="tm-del")tmDelete(t.dataset.k);
    else if(act==="hist-me"){H.me=t.dataset.c;render()}
    else if(act==="goal-edit")openGoal(id);

    else if(act==="streak-del")del("streaks",id);
    else if(act==="csv")exportCsv();
    return;
  }
  if(t.closest("#devSeg")){var d=t.dataset.dev;var s=cur();saveSettings({device:d});if(s)put("sessions",s.id,Object.assign(strip(s),{dev:d}));return}
  if(t.closest("#tabs")){togglePane(t.dataset.p);return}
  if(t.classList.contains("optile")){

  if(t.closest("#eTags")){eTagSel[t.dataset.t]=!eTagSel[t.dataset.t];t.setAttribute("aria-pressed",String(!!eTagSel[t.dataset.t]));return}
});

function comboStr(t){
  var o="",i=0;
  while(i<t.length){
    var x=t[i],piece;
    if((isDirs(x)||x==="j.")&&i+1<t.length&&isBtn(t[i+1])){piece=x+t[i+1];i+=2}else{piece=x;i++}
    o+=(piece===","||!o)?piece:" "+piece;
  }
  return o;
}
function cbPaint(){
  var el=$("#cbLine");if(!el)return;
  var h=CB.toks.length?esc(comboStr(CB.toks)):'<span class="ph">Click here, then type: 1–9 directions · P / K buttons · d = DRC</span>';
  el.innerHTML=h+'<span class="caret"></span>';
}
function cbPush(tok){CB.toks.push(tok);CB.lt=null;cbPaint()}
function cbDir(d){
  var now=Date.now(),L=CB.toks[CB.toks.length-1];
  if(L&&isDirs(L)){CB.toks[CB.toks.length-1]=L+d}else CB.toks.push(d);
  CB.lt=null;CB.lastDir=now;cbPaint();
}
function cbDown(k){if(CB.hold[k]==null)CB.hold[k]=Date.now()}
function cbUp(k){
  if(CB.hold[k]==null)return;
  var d=Date.now()-CB.hold[k];delete CB.hold[k];
  if(d>=HOLD_MS){cbPush(k);return}
  var now=Date.now(),lt=CB.lt;
  if(lt&&lt.k===k&&now-lt.t<TAP_MS&&CB.toks.length-1===lt.idx){lt.lvl=lt.lvl%4+1;lt.t=now;CB.toks[lt.idx]=LV[lt.lvl]+k}
  else{CB.toks.push("L"+k);CB.lt={k:k,t:now,lvl:1,idx:CB.toks.length-1}}
  cbPaint();
}

  if(tg==="INPUT"||tg==="TEXTAREA"||tg==="SELECT")return;
  if(ae&&ae!==document.body&&!ae.closest(".cb"))return;
  var k=e.key,low=k.length===1?k.toLowerCase():k;
  if(/^[1-9]$/.test(k)){e.preventDefault();cbDir(k)}
  else if((low==="p"||low==="k")&&e.shiftKey){e.preventDefault();if(!e.repeat)cbPush(low.toUpperCase()+low.toUpperCase())}
  else if(low==="p"||low==="k"){e.preventDefault();if(!e.repeat)cbDown(low.toUpperCase())}
  else if(k===" "){e.preventDefault();CB.lt=null}
  else if(low==="s"){e.preventDefault();cbSA()}
  else if(MACK[low]){e.preventDefault();cbPush(MACK[low])}
  else if(TOKK[k]){e.preventDefault();cbPush(TOKK[k])}
  else if(CKEYS.indexOf(low)>=0&&CMK(low)){e.preventDefault();cbPush(CMK(low))}
  else if(k==="Backspace"){e.preventDefault();cbBack()}
  else if(k==="Enter"&&(!ae||ae===document.body||ae.id==="cbLine")){e.preventDefault();cbSave()}
});
document.addEventListener("keyup",function(e){
  if(!$("#cbLine"))return;var low=e.key.length===1?e.key.toLowerCase():e.key;
  if((low==="p"||low==="k")&&CB.hold[low.toUpperCase()]!=null)cbUp(low.toUpperCase());
});
document.addEventListener("pointerdown",function(e){var b=e.target.closest&&e.target.closest("[data-pk]");if(!b)return;e.preventDefault();CB.ptr=b.dataset.pk;b.classList.add("down");cbDown(CB.ptr)});
function cbPtrEnd(){if(CB.ptr){var k=CB.ptr;CB.ptr=null;$$(".pk button.down").forEach(function(b){b.classList.remove("down")});cbUp(k)}}
document.addEventListener("pointerup",cbPtrEnd);document.addEventListener("pointercancel",cbPtrEnd);
/* ---------- import from the Trainer'\u2019s classic win/loss tracker (sf6-tracker:*) ---------- */
var CLASSIC_TAGS=[["no-anti-air","Didn't anti-air"],["lost-neutral-di","Lost neutral to DI"],["whiff-punished","Whiff punished too much"],["dropped-combo","Dropped combo"],["raw-dp","Threw out raw DP"],["broken-throw","Couldn't break throw"],["poor-wakeup","Poor wakeup defense"],["no-meter","Ran out of meter at key moment"],["tilted","Tilted / made bad reads"]];
function classicName(id){if(!id)return null;if(id==="bison")return "M. Bison";for(var i=0;i<ROSTER.length;i++){if(ROSTER[i].toLowerCase().replace(/[^a-z]/g,"")===id)return ROSTER[i]}return id}
function importClassic(l){
  var m,se,ct;
  try{m=JSON.parse(localStorage.getItem("sf6-tracker:matches")||"null");se=JSON.parse(localStorage.getItem("sf6-tracker:sessions")||"null");ct=JSON.parse(localStorage.getItem("sf6-tracker:custom-loss-tags")||"null")}catch(e){return l}
  if(!Array.isArray(m)||!m.length)return l;
  l.games=l.games||[];l.sessions=l.sessions||[];l.settings=l.settings||{};
  var seen=l.settings.classicSeen||[],add=m.filter(function(x){return x&&x.id&&seen.indexOf(x.id)<0});
  if(!add.length)return l;
  var sids={};l.sessions.forEach(function(x){sids[x.id]=1});
  (se||[]).forEach(function(x){
    if(!x||!x.id||sids[x.id])return;
    var old=!x.endedAt&&(Date.now()-x.startedAt>432e5);
    l.sessions.push({id:x.id,start:x.startedAt,end:x.endedAt||(old?x.startedAt:undefined),closed:!!x.endedAt||old,rule:(x.intent&&x.intent.goal)||"",cues:[],check:{calm:3,focus:3,hands:3},dev:"Pad",me:"Ken",stop:3});
  });
  var tags=Array.isArray(l.settings.tags)&&l.settings.tags.length?l.settings.tags.slice():TAGS.map(function(t){return {k:t[0],n:t[1],t:t[2]}});
  var have={};tags.forEach(function(t){have[t.k]=1});
  CLASSIC_TAGS.concat((ct||[]).map(function(t){return [t.id,t.label]})).forEach(function(t){if(!have[t[0]]){have[t[0]]=1;tags.push({k:t[0],n:t[1],t:"leak"})}});
  l.settings.tags=tags;
  add.forEach(function(x){
    l.games.push({id:"c"+x.id,t:x.timestamp,sid:x.sessionId,r:x.result,char:classicName(x.opponentCharacter),oppMR:null,myMR:null,opp:"",rm:false,tags:x.lossTags||[],note:x.notes||"",dev:"Pad",me:classicName(x.yourCharacter)||"Ken",mode:"ranked"});
    seen.push(x.id);
  });
  l.settings.classicSeen=seen;lsSet(LS,l);return l;
}

/* ---------- replay review ---------- */
var RV={id:null,arm:null,armT:null,fc:"",fk:"",fd:"open"};
var RVCAT=["Execution","Defense","Matchup","Awareness","Knowledge","Coaching violation"];
var RVF=[["rvOpp","opp"],["rvId","mid"],["rvGame","game"],["rvRound","round"],["rvTime","time"],["rvWhat","what"],["rvLab","lab"],["rvSol","sol"],["rvDrill","drill"],["rvCue","cue"]];
function rvOpts(a,sel,blank){return (blank?'<option value="">'+blank+'</option>':'')+a.map(function(c){return '<option'+(c===sel?' selected':'')+'>'+esc(c)+'</option>'}).join("")}
function rvLbl(t,inner){return '<label>'+t+inner+'</label>'}
var RVSKEL='<div class="rv"><div class="rvg">'+
 rvLbl("Opponent",'<input id="rvOpp" type="text" autocomplete="off" placeholder="Name / tag">')+
 rvLbl("Their character",'<select id="rvOc"></select>')+
 rvLbl("My character",'<select id="rvMc"></select>')+
 rvLbl("Match / replay ID (optional)",'<input id="rvId" type="text" autocomplete="off" placeholder="e.g. 1234567">')+
 rvLbl("Game",'<select id="rvGame"><option value="">–</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>')+
 rvLbl("Round",'<select id="rvRound"><option value="">–</option><option>1</option><option>2</option><option>3</option><option>Final</option></select>')+
 rvLbl("Time left (clock)",'<input id="rvTime" type="text" inputmode="numeric" autocomplete="off" placeholder="e.g. 62">')+
 rvLbl("Category",'<select id="rvCat"></select>')+
 '</div>'+
 rvLbl("What happened",'<textarea id="rvWhat" placeholder="Situation, what they did, what I did, the result"></textarea>')+
 rvLbl("What to lab",'<textarea id="rvLab" placeholder="Training-mode setup / situation to recreate"></textarea>')+
 rvLbl("Solution",'<textarea id="rvSol" placeholder="The answer: button, option, frame truth"></textarea>')+
 '<div class="rvg">'+rvLbl("Drill",'<input id="rvDrill" type="text" autocomplete="off" placeholder="Drill to run (e.g. 10 reps vs reversal)">')+rvLbl("Cue word",'<input id="rvCue" type="text" autocomplete="off" placeholder="One word">')+'</div>'+
 '<div class="cbacts"><button id="rvSave" type="button" class="btn primary" data-act="rv-save">Save review</button><button type="button" class="btn" data-act="rv-clear">Clear</button></div>'+
 '<h3 style="margin:.3rem 0 0">Reviews <span id="rvCount" class="mute" style="font-size:.8rem;font-weight:400"></span></h3>'+
 '<div class="rvg"><select id="fC" aria-label="Filter character"></select><select id="fK" aria-label="Filter category"></select><select id="fD" aria-label="Filter drills"><option value="open">Drills to do</option><option value="all">All</option><option value="done">Drills done</option></select></div>'+
 '<div id="rvList" style="display:flex;flex-direction:column;gap:.45rem"></div></div>';
function rvVal(id){return ($("#"+id).value||"").trim()}
function rvReset(){
  RV.id=null;RVF.forEach(function(f){var e=$("#"+f[0]);if(e)e.value=""});
  $("#rvWhat").value="";$("#rvCat").selectedIndex=0;$("#rvOc").value="";$("#rvMc").value=meNow();$("#rvSave").textContent="Save review";
}
function rvSave(){
  var o={opp:rvVal("rvOpp"),oc:$("#rvOc").value,mc:$("#rvMc").value,mid:rvVal("rvId"),game:$("#rvGame").value,round:$("#rvRound").value,time:rvVal("rvTime"),cat:$("#rvCat").value,what:rvVal("rvWhat"),lab:rvVal("rvLab"),sol:rvVal("rvSol"),drill:rvVal("rvDrill"),cue:rvVal("rvCue")};
  if(!o.what&&!o.lab&&!o.sol&&!o.drill){toast("Fill in what happened (or a lab/solution/drill) first");return}
  var old=RV.id?byId(S.reviews,RV.id):null,id=RV.id||("r"+Date.now().toString(36));
  o.done=old?!!old.done:false;o.created=old&&old.created||Date.now();o.upd=Date.now();
  put("reviews",id,o);toast("Review saved");rvReset();
}
function rvLoad(id){
  var r=byId(S.reviews,id);if(!r)return;RV.id=id;
  RVF.forEach(function(f){var e=$("#"+f[0]);if(e)e.value=r[f[1]]||""});
  $("#rvOc").value=r.oc||"";$("#rvMc").value=r.mc||meNow();$("#rvCat").value=r.cat||RVCAT[0];$("#rvSave").textContent="Update review";
  $("#rvOpp").scrollIntoView&&$("#rvOpp").scrollIntoView({block:"center"});
}
function rvDone(id){var r=byId(S.reviews,id);if(r)put("reviews",id,Object.assign(strip(r),{done:!r.done}))}
function rvDel(id){
  if(RV.arm===id){clearTimeout(RV.armT);RV.arm=null;if(RV.id===id)rvReset();del("reviews",id);return}
  RV.arm=id;clearTimeout(RV.armT);RV.armT=setTimeout(function(){RV.arm=null;render()},3000);render();
}
function rvCardText(r){
  return [ (r.mc||"")+" vs "+(r.oc||"?")+(r.opp?" ("+r.opp+")":"")+(r.mid?" · ID "+r.mid:""),
   "G"+(r.game||"?")+" R"+(r.round||"?")+(r.time?" · "+r.time+" left":"")+" · "+(r.cat||""),
   "Situation: "+(r.what||"–"),"Lab: "+(r.lab||"–"),"Answer: "+(r.sol||"–"),"Drill: "+(r.drill||"–"),"Cue: "+(r.cue||"–")].join("\n");
}
function rvCopy(id){var r=byId(S.reviews,id);if(!r)return;var t=rvCardText(r);
  try{navigator.clipboard.writeText(t).then(function(){toast("Card copied")},function(){toast("Copy blocked by the browser")})}catch(e){toast("Copy not available here")}}
function rvList(){
  var a=S.reviews.filter(function(r){
    if(RV.fc&&r.oc!==RV.fc)return false;if(RV.fk&&r.cat!==RV.fk)return false;
    if(RV.fd==="open"&&(r.done||!r.drill))return false;if(RV.fd==="done"&&!r.done)return false;return true;
  }).sort(function(x,y){return (y.upd||0)-(x.upd||0)});
  var open=S.reviews.filter(function(r){return r.drill&&!r.done}).length;
  var ce=$("#rvCount");if(ce)ce.textContent="· "+open+" drill"+(open===1?"":"s")+" to do";
  if(!a.length)return '<p class="mute">Nothing here yet. Log a moment from a replay above.</p>';
  return a.map(function(r){
    var p=function(l,t){return t?'<p><span>'+l+'</span>'+esc(t)+'</p>':''};
    return '<div class="rvrow'+(r.done?' done':'')+'"><div class="rvh"><b>'+esc(r.oc||"?")+'</b><span class="rvq">'+esc(r.opp||"")+(r.mid?' · ID '+esc(r.mid):'')+'</span><span class="rvq">G'+esc(r.game||"?")+' R'+esc(r.round||"?")+(r.time?' · '+esc(r.time)+' left':'')+'</span><span class="rvtag">'+esc(r.cat||"")+'</span></div>'+
     p("Happened",r.what)+p("Lab",r.lab)+p("Answer",r.sol)+p("Drill",r.drill+(r.cue?'  ·  cue: '+r.cue:''))+
     '<div class="rvh" style="margin-top:.2rem"><button type="button" class="mini" data-act="rv-done" data-id="'+esc(r.id)+'" style="min-height:2.6rem;min-width:5.5rem">'+(r.done?'Re-open':'Drill done')+'</button>'+
     (r.oc&&FRAMED?'<button type="button" class="mini" data-act="study" data-c="'+esc(r.oc)+'" style="min-height:2.6rem;min-width:4.4rem">Study</button>':'')+'<button type="button" class="mini" data-act="rv-copy" data-id="'+esc(r.id)+'" style="min-height:2.6rem;min-width:4.4rem">Copy</button>'+
     '<button type="button" class="mini" data-act="rv-edit" data-id="'+esc(r.id)+'" style="min-height:2.6rem;min-width:3.6rem">Edit</button>'+
     '<button type="button" class="mini'+(RV.arm===r.id?' danger':'')+'" data-act="rv-del" data-id="'+esc(r.id)+'" style="min-height:2.6rem;min-width:4.2rem">'+(RV.arm===r.id?'Sure?':'Delete')+'</button></div></div>';
  }).join("");
}
function updateReview(){
  var el=$("#review");if(!el)return;
  if(!el.dataset.built){
    el.dataset.built="1";el.innerHTML=RVSKEL;
    $("#rvOc").innerHTML=rvOpts(ROSTER,"","Pick…");$("#rvMc").innerHTML=rvOpts(ROSTER,meNow());$("#rvCat").innerHTML=rvOpts(RVCAT,RVCAT[0]);
    $("#fC").innerHTML=rvOpts(ROSTER,"","All characters");$("#fK").innerHTML=rvOpts(RVCAT,"","All categories");
    $("#fC").onchange=function(){RV.fc=this.value;updateReview()};$("#fK").onchange=function(){RV.fk=this.value;updateReview()};$("#fD").onchange=function(){RV.fd=this.value;updateReview()};
  }
  setHTML($("#rvList"),rvList());
}

init();
})();
</script>
