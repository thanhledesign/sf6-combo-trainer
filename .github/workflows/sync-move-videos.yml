name: Sync move videos

# Maps every move on streetfighter.com's movelist to its demo video and saves a manifest
# (src/data/videos/<char>.json). With "download" on, files are uploaded to Supabase Storage
# (bucket move-videos) — never committed to git. Needs repo secret SUPABASE_SERVICE_KEY
# for the download step.

on:
  workflow_dispatch:
    inputs:
      chars:
        description: 'Comma-separated character ids (e.g. ken,ryu). Blank = priority roster (Ken + most-faced).'
        required: false
        default: ''
      all:
        description: 'Every character instead of the priority roster'
        type: boolean
        default: false
      download:
        description: 'Also download the videos into Supabase Storage'
        type: boolean
        default: false
      probe:
        description: 'Debug: dump what the movelist page contains (uploads as an artifact, no manifest)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  videos:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Scrape movelist videos
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.chars }}" ]; then ARGS="$ARGS --chars=${{ inputs.chars }}"; fi
          if [ "${{ inputs.all }}" = "true" ]; then ARGS="$ARGS --all"; fi
          if [ "${{ inputs.download }}" = "true" ]; then ARGS="$ARGS --download"; fi
          if [ "${{ inputs.probe }}" = "true" ]; then ARGS="$ARGS --probe"; fi
          node scripts/sync/scrape-videos.mjs $ARGS

      - name: Upload scratch output (probe dumps / local downloads)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-out
          path: video-out/
          if-no-files-found: ignore

      - name: Open PR with the manifest
        if: ${{ !inputs.probe }}
        uses: peter-evans/create-pull-request@v6
        with:
          branch: data-sync/videos-${{ github.run_id }}
          title: "data: movelist video manifest (${{ github.run_id }})"
          commit-message: "data: movelist video manifest"
          add-paths: src/data/videos/*.json
          body: |
            Move → video links from streetfighter.com's movelist. Files (if downloaded) live in Supabase Storage, not git.
            Check the unmatched / moves-without-video lists at the bottom of each manifest.
          delete-branch: true
